name: Verify

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tripos-api-server/package-lock.json
            tripos-mobile-app/package-lock.json

      - name: Install repository tooling
        run: npm ci

      - name: Run repository documentation check
        run: npm run docs:check
