name: Verify

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tripos-api-server/package-lock.json
            tripos-mobile-app/package-lock.json

      - name: Install repository tooling
        run: npm ci

      - name: Install API dependencies
        run: npm ci
        working-directory: tripos-api-server

      - name: Install admin CRM dependencies
        run: npm ci
        working-directory: tripos-admin-crm

      - name: Install mobile dependencies
        run: npm ci
        working-directory: tripos-mobile-app

      - name: Install public website dependencies
        run: npm ci
        working-directory: tripos-public-website

      - name: Lint API
        run: npm run lint:check
        working-directory: tripos-api-server

      - name: Typecheck API
        run: npm run typecheck
        working-directory: tripos-api-server

      - name: Test API
        run: npm run test -- --runInBand
        working-directory: tripos-api-server

      - name: Build API
        run: npm run build
        working-directory: tripos-api-server

      - name: Lint admin CRM
        run: npm run lint
        working-directory: tripos-admin-crm

      - name: Typecheck admin CRM
        run: npm run typecheck
        working-directory: tripos-admin-crm

      - name: Build admin CRM
        run: npm run build
        working-directory: tripos-admin-crm

      - name: Lint public website
        run: npm run lint
        working-directory: tripos-public-website

      - name: Typecheck public website
        run: npm run typecheck
        working-directory: tripos-public-website

      - name: Build public website
        run: npm run build
        working-directory: tripos-public-website

      - name: Lint mobile
        run: npm run lint
        working-directory: tripos-mobile-app

      - name: Typecheck mobile
        run: npm run typecheck
        working-directory: tripos-mobile-app

      - name: Test mobile
        run: npm run test -- --runInBand
        working-directory: tripos-mobile-app
